name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "generator/**"
      - ".claude/**"
      - ".githooks/**"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "generator/**"
      - ".claude/**"
      - ".githooks/**"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
