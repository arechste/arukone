[tools]
bun = "latest"
node = "24"

[tasks.dev]
description = "Start dev server"
run = "bun run dev --host"

[tasks."dev:stop"]
description = "Stop dev server"
run = "lsof -ti:5173 | xargs kill -9 2>/dev/null || true"

[tasks."dev:restart"]
description = "Restart dev server"
depends = ["dev:stop"]
run = "mise run dev"

[tasks.test]
description = "Run tests"
run = "bunx vitest run"

[tasks.smoke]
description = "Run Playwright smoke tests (set SMOKE_URL for remote target)"
run = "bunx playwright test"

[tasks.lint]
description = "Run ESLint"
run = "bun run lint"

[tasks.check]
description = "Lint + typecheck"
run = ["bun run lint", "bun run --bun tsc -b --noEmit"]

[tasks.audit]
description = "Audit dependencies for vulnerabilities"
run = "bun audit --audit-level=high"

[tasks."hooks:install"]
description = "Install pre-commit framework hooks (one-time per clone)"
run = "pre-commit install"

[tasks."hooks:run"]
description = "Run all pre-commit hooks against all files"
run = "pre-commit run --all-files"

[tasks."hooks:update"]
description = "Bump pinned hook revisions (review SHA changes before committing)"
run = "pre-commit autoupdate"

[tasks.build]
description = "Type-check + build"
run = "bun run build"

[tasks."deploy:dry"]
description = "Validate Cloudflare config (no credentials needed)"
depends = ["build"]
run = "bunx wrangler deploy --dry-run --env production --outdir .tmp/deploy-preview"

[tasks."deploy:preview"]
description = "Deploy to preview env (uses 1Password via op run)"
depends = ["build"]
run = "op run --account arcavault --env-file=.env.op -- bunx wrangler deploy --env preview"

[tasks."deploy:production"]
description = "Deploy to production env (uses 1Password via op run)"
depends = ["build"]
run = "op run --account arcavault --env-file=.env.op -- bunx wrangler deploy --env production"
